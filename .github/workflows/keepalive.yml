name: Keep Render + MongoDB Alive

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -sSf "${{ secrets.RENDER_BACKEND_URL }}/health" || echo "Ping failed"
